<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黄金螺旋 · Golden Spiral</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #050403;
    font-family: Georgia, "Times New Roman", serif;
  }

  /* ── 渲染框 ───────────────────────────────────────── */
  .canvas-frame {
    position: relative;
    width: min(88vmin, 720px);
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 42%, #17110a 0%, #0a0806 58%, #050403 100%);
    box-shadow:
      inset 0 0 0 1px rgba(214, 168, 86, .16),
      inset 0 0 130px rgba(214, 168, 86, .055),
      0 34px 90px -46px #000;
  }
  .canvas-frame svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>

  <div class="canvas-frame" id="frame"></div>

<script>
(() => {
  'use strict';

  /* ══════════════════════════════════════════════════════════
     ①  黄金螺旋的数学定义
         r(θ) = r₀ · e^(bθ),   b = ln φ / (π/2)
         含义：每转过 90°，半径就乘以黄金比 φ
     ══════════════════════════════════════════════════════════ */
  const PHI = (1 + Math.sqrt(5)) / 2;          // 1.6180339887498949
  const B   = Math.log(PHI) / (Math.PI / 2);   // ≈ 0.30634896

  /* ══════════════════════════════════════════════════════════
     ②  绘制参数（想改效果，动这里就够了）
     ══════════════════════════════════════════════════════════ */
  const W = 720, H = 720;   // SVG 内部坐标
  const PAD   = 44;         // 画布留白
  const TURNS = 4;          // ★ 螺旋圈数（层数越多越绵密）
  const SPP   = 120;        // ★ 每圈采样点数（越大越顺滑）

  const THETA_MAX = TURNS * 2 * Math.PI;
  const STEPS     = Math.round(TURNS * SPP);

  /* ══════════════════════════════════════════════════════════
     ③  采样螺旋上的点
     ══════════════════════════════════════════════════════════ */
  const raw = [];
  for (let i = 0; i <= STEPS; i++) {
    const t = THETA_MAX * i / STEPS;
    const r = Math.exp(B * t);
    raw.push([r * Math.cos(t), r * Math.sin(t)]);
  }

  /* ══════════════════════════════════════════════════════════
     ④  等比缩放 + 自动居中（保证不裁切）
     ══════════════════════════════════════════════════════════ */
  let minX =  Infinity, minY =  Infinity;
  let maxX = -Infinity, maxY = -Infinity;
  for (const [x, y] of raw) {
    if (x < minX) minX = x;
    if (x > maxX) maxX = x;
    if (y < minY) minY = y;
    if (y > maxY) maxY = y;
  }

  const span = Math.max(maxX - minX, maxY - minY);
  const k    = (W - PAD * 2) / span;
  const ox   = W / 2 - k * (minX + maxX) / 2;
  const oy   = H / 2 - k * (minY + maxY) / 2;

  const fx = x => ox + k * x;
  const fy = y => oy + k * y;

  /* ══════════════════════════════════════════════════════════
     ⑤  拼装 path
     ══════════════════════════════════════════════════════════ */
  const seg = [];
  for (let i = 0; i <= STEPS; i++) {
    seg.push((i ? 'L' : 'M') +
             fx(raw[i][0]).toFixed(2) + ' ' +
             fy(raw[i][1]).toFixed(2));
  }
  const d = seg.join(' ');

  const cx = fx(0), cy = fy(0);                       // 螺旋原点
  const rMax = k * Math.exp(B * THETA_MAX);           // 缩放后的最大半径

  /* ══════════════════════════════════════════════════════════
     ⑥  输出 SVG
     ══════════════════════════════════════════════════════════ */
  const svg = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"
     role="img" aria-label="黄金螺旋 / Golden Spiral">

  <defs>
    <!-- 金色渐变：高光 → 深金 -->
    <linearGradient id="goldLine" x1="6%" y1="2%" x2="94%" y2="98%">
      <stop offset="0.00" stop-color="#fff8e2"/>
      <stop offset="0.22" stop-color="#f3dc9f"/>
      <stop offset="0.50" stop-color="#dcb05c"/>
      <stop offset="0.78" stop-color="#b3812f"/>
      <stop offset="1.00" stop-color="#7d5514"/>
    </linearGradient>

    <!-- 中心柔光 -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0.00" stop-color="#ffd98a" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#ffc964" stop-opacity="0.11"/>
      <stop offset="1.00" stop-color="#ffc964" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurBig" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="blurSml" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- 中心氛围光 -->
  <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}"
          r="${(rMax * 0.62).toFixed(1)}" fill="url(#coreGlow)"/>

  <!-- 外层光晕 -->
  <path d="${d}" fill="none" stroke="#e8bf70" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"
        opacity="0.13" filter="url(#blurBig)"/>

  <!-- 螺旋主体 -->
  <path d="${d}" fill="none" stroke="url(#goldLine)" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 内侧高光，让金线有金属感 -->
  <path d="${d}" fill="none" stroke="#fff4d2" stroke-width="0.85"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- 螺旋起点 -->
  <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="9"
          fill="#ffd98a" opacity="0.35" filter="url(#blurSml)"/>
  <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="1.9"
          fill="#fff6dc" opacity="0.95"/>

  <!-- 签名 -->
  <text x="${W - 46}" y="${H - 52}" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="34" fill="#d9b46b" opacity="0.55">φ</text>
  <text x="${W - 46}" y="${H - 28}" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12" letter-spacing="1.5"
        fill="#c9a45f" opacity="0.38">1.6180339887</text>
</svg>`.trim();

  document.getElementById('frame').innerHTML = svg;
})();
</script>
</body>
</html>
